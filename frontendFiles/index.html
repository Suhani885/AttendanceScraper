<!DOCTYPE html>
<html ng-app="app">
<head>
    <meta charset="UTF-8">
    <title>Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <ui-view>
        <div class="container" ng-controller="MainController as mainCtrl">
            <form ng-submit="login()" class="p-1">
               <div class="mb-3">
                 <label for="username" class="form-label mt-4">Library ID </label>
                 <input type="text" ng-model="mainCtrl.username" id="username" class="form-control form-control-lg" autocomplete="on" required>
               </div>
               <div class="mb-3">
                 <label for="password" class="form-label ">Password</label>
                 <input type="password" ng-model="mainCtrl.password" id="password" class="form-control form-control-lg" required>
               </div>
               <div class="text-center mt-1">
                 <button type="submit" class="btn btn-primary btn-lg w-100">Get Attendance</button>
               </div>
           </form>
       
           <div class="container mt-5">
               <div class="subject-list">
                   <div ng-repeat="subject in subjects" class="subject-card">
                       <div class="card">
                           <div class="card-header">
                               <h3>{{subject.code}} - {{subject.name}}</h3>
                               <div class="attendance-summary">
                                   Present: {{subject.total_present}} / {{subject.total_classes}}
                                   ({{subject.attendance_percentage}}%)
                               </div>
                           </div>
                           <div class="card-body">
                               <table class="table">
                                   <thead>
                                       <tr>
                                           <th>Date</th>
                                           <th>Slot</th>
                                           <th>Status</th>
                                       </tr>
                                   </thead>
                                   <tbody>
                                       <tr ng-repeat="detail in subject.attendance_details">
                                           <td>{{detail.date}}</td>
                                           <td>{{detail.slot}}</td>
                                           <td>
                                               <span class="badge"
                                                     ng-class="{'badge-success': detail.status === 'PRESENT','badge-danger': detail.status === 'ABSENT'}">
                                                   {{detail.status}}
                                               </span>
                                           </td>
                                       </tr>
                                   </tbody>
                               </table>
                           </div>
                       </div>
                   </div>
               </div>
           </div> 
       </div>
    </ui-view>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.30/angular-ui-router.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
